<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>彈幕躲避 V1.1</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #0a0a15; touch-action: none; user-select: none; -webkit-user-select: none; }
canvas { display: block; }
#version { position: fixed; top: 8px; left: 8px; color: #00ff88; font-family: monospace; font-size: 14px; font-weight: bold; pointer-events: none; z-index: 10; }
</style>
</head>
<body>
<div id="version">V1.1</div>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ========== 遊戲狀態 ==========
const game = { state: 'playing', score: 0, time: 0 };

// ========== 玩家 ==========
const player = {
  x: canvas.width / 2,
  y: canvas.height / 2,
  radius: 18,
  hp: 100,
  maxHp: 100,
  speed: 4.5,
  shield: 0,
  invincible: 0,
  slowTimer: 0,
  magnetTimer: 0,
  speedTimer: 0,
  reflect: 0
};

// ========== 輸入 ==========
const keys = {};
let touchId = null, touchStartX = 0, touchStartY = 0;

// ========== 實體 ==========
let bullets = [];
let items = [];
let particles = [];
let floatingTexts = [];

// ========== 背包 (20格) ==========
const backpack = {
  slots: new Array(20).fill(null)
};

const ITEM_TYPES = {
  SHIELD: { name: '保護盾', color: '#00aaff', icon: '🛡️', maxStack: 3 },
  ERASER: { name: '消除器', color: '#ff6600', icon: '💥', maxStack: 5 },
  COMPUTER: { name: '電腦', color: '#00ff88', icon: '💻', maxStack: 3 },
  QUILT: { name: '棉被', color: '#ffccaa', icon: '🛏️', maxStack: 5 },
  TIME_CAPSULE: { name: '時間膠囊', color: '#aa88ff', icon: '⏰', maxStack: 5, instant: true },
  MAGNET: { name: '磁鐵', color: '#ff44aa', icon: '🧲', maxStack: 5, instant: true },
  SPEED_BOOST: { name: '加速鞋', color: '#ffee00', icon: '💨', maxStack: 5, instant: true },
  REFLECT: { name: '反彈盾', color: '#00ffff', icon: '⚡', maxStack: 3 }
};

// ========== 音效 ==========
const sounds = {};
function loadSound(name, url) {
  const a = new Audio(url);
  a.volume = 0.35;
  sounds[name] = a;
}
loadSound('pickup', 'https://assets.mixkit.co/active_storage/sfx/2578/2578-preview.mp3');
loadSound('hit', 'https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3');
loadSound('shield', 'https://assets.mixkit.co/active_storage/sfx/2019/2019-preview.mp3');
loadSound('revive', 'https://assets.mixkit.co/active_storage/sfx/1434/1434-preview.mp3');
loadSound('eraser', 'https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3');

function playSound(name) {
  if (sounds[name]) {
    sounds[name].currentTime = 0;
    sounds[name].play().catch(() => {});
  }
}

// ========== 鍵盤輸入 ==========
document.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (e.key === ' ' || e.key.toLowerCase() === 'e') {
    e.preventDefault();
    useEraser();
  }
});
document.addEventListener('keyup', e => {
  keys[e.key.toLowerCase()] = false;
});

// ========== 觸控輸入 ==========
canvas.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    touchId = e.touches[0].identifier;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  for (let i = 0; i < e.changedTouches.length; i++) {
    if (e.changedTouches[i].identifier === touchId) {
      const dx = e.changedTouches[i].clientX - touchStartX;
      const dy = e.changedTouches[i].clientY - touchStartY;
      player.x += dx * 0.8;
      player.y += dy * 0.8;
      touchStartX = e.changedTouches[i].clientX;
      touchStartY = e.changedTouches[i].clientY;
    }
  }
}, { passive: false });

canvas.addEventListener('touchend', e => {
  for (let i = 0; i < e.changedTouches.length; i++) {
    if (e.changedTouches[i].identifier === touchId) {
      touchId = null;
    }
  }
});
canvas.addEventListener('touchcancel', e => { touchId = null; });

// ========== 背包工具函數 ==========
function addToBackpack(type) {
  for (let i = 0; i < backpack.slots.length; i++) {
    if (backpack.slots[i] === null) {
      backpack.slots[i] = { type: type, count: 1 };
      return true;
    } else if (backpack.slots[i].type === type && backpack.slots[i].count < ITEM_TYPES[type].maxStack) {
      backpack.slots[i].count++;
      return true;
    }
  }
  return false;
}

function countInBackpack(type) {
  let count = 0;
  for (let i = 0; i < backpack.slots.length; i++) {
    if (backpack.slots[i] && backpack.slots[i].type === type) count += backpack.slots[i].count;
  }
  return count;
}

function removeFromBackpack(type, count = 1) {
  for (let i = 0; i < backpack.slots.length && count > 0; i++) {
    if (backpack.slots[i] && backpack.slots[i].type === type) {
      const remove = Math.min(count, backpack.slots[i].count);
      backpack.slots[i].count -= remove;
      count -= remove;
      if (backpack.slots[i].count <= 0) backpack.slots[i] = null;
    }
  }
}

// ========== 使用消除器 ==========
function useEraser() {
  if (countInBackpack('ERASER') > 0) {
    removeFromBackpack('ERASER', 1);
    playSound('eraser');
    const range = 180;
    let cleared = 0;
    for (let i = bullets.length - 1; i >= 0; i--) {
      const dx = bullets[i].x - player.x;
      const dy = bullets[i].y - player.y;
      if (Math.sqrt(dx * dx + dy * dy) < range) {
        createParticles(bullets[i].x, bullets[i].y, '#ffff00', 5);
        bullets.splice(i, 1);
        cleared++;
      }
    }
    if (cleared > 0) {
      floatingTexts.push({ x: player.x, y: player.y - 30, text: '清除 ' + cleared + ' 發!', life: 60, color: '#ff6600' });
    }
  }
}

// ========== 生成子彈 ==========
function spawnBullet() {
  const side = Math.floor(Math.random() * 4);
  let x, y, vx, vy;
  const speed = 1.5 + game.time * 0.0005 + Math.random() * 1.5;
  const margin = 30;
  if (side === 0) { x = Math.random() * canvas.width; y = -margin; }
  else if (side === 1) { x = canvas.width + margin; y = Math.random() * canvas.height; }
  else if (side === 2) { x = Math.random() * canvas.width; y = canvas.height + margin; }
  else { x = -margin; y = Math.random() * canvas.height; }
  const angle = Math.atan2(player.y - y, player.x - x);
  vx = Math.cos(angle) * speed;
  vy = Math.sin(angle) * speed;
  bullets.push({ x, y, vx, vy, radius: 5, color: '#ff0044', friendly: false });
}

// ========== 生成道具 ==========
function spawnItem() {
  const types = ['SHIELD', 'ERASER', 'COMPUTER', 'QUILT', 'TIME_CAPSULE', 'MAGNET', 'SPEED_BOOST', 'REFLECT'];
  const type = types[Math.floor(Math.random() * types.length)];
  const x = 50 + Math.random() * (canvas.width - 100);
  const y = 50 + Math.random() * (canvas.height - 100);
  items.push({ x, y, type, radius: 14, life: 600 });
}

// ========== 粒子效果 ==========
function createParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1 + Math.random() * 3;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 30 + Math.random() * 20,
      color, radius: 2 + Math.random() * 3
    });
  }
}

// ========== 受傷處理 ==========
function takeDamage(amount, bulletRef) {
  if (player.invincible > 0) return;

  // 0. 反彈盾優先（把子彈彈回去變成友軍子彈）
  if (player.reflect > 0 && bulletRef) {
    player.reflect--;
    playSound('shield');
    bulletRef.vx *= -1.6;
    bulletRef.vy *= -1.6;
    bulletRef.friendly = true;
    bulletRef.color = '#00ffff';
    createParticles(player.x, player.y, '#00ffff', 10);
    floatingTexts.push({ x: player.x, y: player.y - 40, text: '⚡反彈! (' + player.reflect + ')', life: 45, color: '#00ffff' });
    return true; // 表示子彈不刪除，被反彈了
  }

  // 1. 保護盾優先
  if (player.shield > 0) {
    player.shield--;
    playSound('shield');
    createParticles(player.x, player.y, '#00aaff', 10);
    floatingTexts.push({ x: player.x, y: player.y - 40, text: '護盾抵擋! (' + player.shield + ')', life: 45, color: '#00aaff' });
    if (player.shield <= 0) {
      floatingTexts.push({ x: player.x, y: player.y - 55, text: '護盾破碎!', life: 45, color: '#ff0044' });
    }
    return false;
  }

  // 2. 棉被自動擋一次
  if (countInBackpack('QUILT') > 0) {
    removeFromBackpack('QUILT', 1);
    playSound('shield');
    createParticles(player.x, player.y, '#ffccaa', 8);
    floatingTexts.push({ x: player.x, y: player.y - 40, text: '🛏️棉被擋住了!', life: 45, color: '#ffccaa' });
    return false;
  }

  // 3. 扣血
  player.hp -= amount;
  playSound('hit');
  createParticles(player.x, player.y, '#ff0044', 8);
  player.invincible = 30;

  if (player.hp <= 0) {
    player.hp = 0;
    handleDeath();
  }
  return false;
}

// ========== 死亡處理（被動復活） ==========
function handleDeath() {
  // 優先順序：消除器 > 電腦
  if (countInBackpack('ERASER') > 0) {
    removeFromBackpack('ERASER', 1);
    revivePlayer('💥消除器復活!');
    return;
  }
  if (countInBackpack('COMPUTER') > 0) {
    removeFromBackpack('COMPUTER', 1);
    revivePlayer('💻電腦復活!');
    return;
  }
  // 真的死了
  game.state = 'gameover';
  floatingTexts.push({ x: canvas.width / 2, y: canvas.height / 2 - 40, text: '遊戲結束! 分數:' + game.score, life: 300, color: '#ff0044' });
}

function revivePlayer(msg) {
  player.hp = player.maxHp;
  player.invincible = 120;
  playSound('revive');
  createParticles(player.x, player.y, '#00ff88', 20);
  floatingTexts.push({ x: player.x, y: player.y - 50, text: msg, life: 60, color: '#00ff88' });
  // 復活時清除周圍子彈
  for (let i = bullets.length - 1; i >= 0; i--) {
    const dx = bullets[i].x - player.x;
    const dy = bullets[i].y - player.y;
    if (Math.sqrt(dx * dx + dy * dy) < 150) {
      bullets.splice(i, 1);
    }
  }
}

// ========== 使用即時道具效果 ==========
function activateInstantItem(type) {
  if (type === 'TIME_CAPSULE') {
    player.slowTimer = 180; // 3秒 (60fps)
    floatingTexts.push({ x: player.x, y: player.y - 40, text: '⏰時間減緩!', life: 50, color: '#aa88ff' });
  } else if (type === 'MAGNET') {
    player.magnetTimer = 300; // 5秒
    floatingTexts.push({ x: player.x, y: player.y - 40, text: '🧲磁力吸引!', life: 50, color: '#ff44aa' });
  } else if (type === 'SPEED_BOOST') {
    player.speedTimer = 300; // 5秒
    floatingTexts.push({ x: player.x, y: player.y - 40, text: '💨加速中!', life: 50, color: '#ffee00' });
  }
}

// ========== 更新 ==========
function update() {
  if (game.state !== 'playing') return;

  game.time++;
  game.score = Math.floor(game.time / 10);

  // 計時型 buff 遞減
  if (player.slowTimer > 0) player.slowTimer--;
  if (player.magnetTimer > 0) player.magnetTimer--;
  if (player.speedTimer > 0) player.speedTimer--;

  // 玩家移動（鍵盤）
  let mx = 0, my = 0;
  if (keys['w'] || keys['arrowup']) my -= 1;
  if (keys['s'] || keys['arrowdown']) my += 1;
  if (keys['a'] || keys['arrowleft']) mx -= 1;
  if (keys['d'] || keys['arrowright']) mx += 1;
  if (mx !== 0 || my !== 0) {
    const len = Math.sqrt(mx * mx + my * my);
    mx /= len; my /= len;
  }
  const currentSpeed = player.speedTimer > 0 ? player.speed * 1.8 : player.speed;
  player.x += mx * currentSpeed;
  player.y += my * currentSpeed;

  // 邊界限制
  player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
  player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));

  // 無敵時間遞減
  if (player.invincible > 0) player.invincible--;

  // 生成子彈
  const spawnRate = Math.max(5, 30 - Math.floor(game.time / 300));
  if (game.time % spawnRate === 0) spawnBullet();
  if (game.time > 600 && game.time % (spawnRate * 2) === 0) spawnBullet();
  if (game.time > 1800 && game.time % (spawnRate * 3) === 0) spawnBullet();

  // 生成道具
  if (game.time % 400 === 0) spawnItem();

  // 子彈減速倍率（時間膠囊效果）
  const slowMul = player.slowTimer > 0 ? 0.4 : 1;

  // 更新子彈
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx * slowMul;
    b.y += b.vy * slowMul;
    if (b.x < -50 || b.x > canvas.width + 50 || b.y < -50 || b.y > canvas.height + 50) {
      bullets.splice(i, 1);
      continue;
    }

    if (b.friendly) {
      // 友軍反彈子彈：碰到敵方子彈就互相消除
      for (let j = bullets.length - 1; j >= 0; j--) {
        if (j === i || bullets[j].friendly) continue;
        const dx2 = bullets[j].x - b.x;
        const dy2 = bullets[j].y - b.y;
        if (Math.sqrt(dx2 * dx2 + dy2 * dy2) < b.radius + bullets[j].radius) {
          createParticles(b.x, b.y, '#00ffff', 6);
          bullets.splice(j, 1);
          if (j < i) i--;
          bullets.splice(i, 1);
          break;
        }
      }
      continue;
    }

    // 碰撞檢測
    const dx = b.x - player.x;
    const dy = b.y - player.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < b.radius + player.radius) {
      const reflected = takeDamage(10, b);
      if (!reflected) bullets.splice(i, 1);
    }
  }

  // 更新道具
  for (let i = items.length - 1; i >= 0; i--) {
    const item = items[i];
    item.life--;
    if (item.life <= 0) {
      items.splice(i, 1);
      continue;
    }

    // 磁鐵效果：吸引道具靠近玩家
    if (player.magnetTimer > 0) {
      const dxm = player.x - item.x;
      const dym = player.y - item.y;
      const distm = Math.sqrt(dxm * dxm + dym * dym);
      if (distm > 1 && distm < 500) {
        item.x += (dxm / distm) * 6;
        item.y += (dym / distm) * 6;
      }
    }

    const dx = item.x - player.x;
    const dy = item.y - player.y;
    if (Math.sqrt(dx * dx + dy * dy) < item.radius + player.radius) {
      const info = ITEM_TYPES[item.type];
      if (info.instant) {
        // 即時型道具：直接觸發效果，不佔背包格
        playSound('pickup');
        activateInstantItem(item.type);
        items.splice(i, 1);
      } else if (addToBackpack(item.type)) {
        playSound('pickup');
        if (item.type === 'SHIELD') {
          player.shield = 3;
          floatingTexts.push({ x: player.x, y: player.y - 40, text: '🛡️護盾啟動(3次)', life: 50, color: '#00aaff' });
        } else if (item.type === 'REFLECT') {
          player.reflect = Math.min(player.reflect + 3, 9);
          floatingTexts.push({ x: player.x, y: player.y - 40, text: '⚡反彈盾啟動(+3)', life: 50, color: '#00ffff' });
        } else {
          floatingTexts.push({ x: player.x, y: player.y - 40, text: ITEM_TYPES[item.type].icon + ' ' + ITEM_TYPES[item.type].name, life: 50, color: ITEM_TYPES[item.type].color });
        }
        items.splice(i, 1);
      }
    }
  }

  // 更新粒子
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }

  // 更新漂浮文字
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    floatingTexts[i].y -= 0.5;
    floatingTexts[i].life--;
    if (floatingTexts[i].life <= 0) floatingTexts.splice(i, 1);
  }
}

// ========== 繪製 ==========
function draw() {
  ctx.fillStyle = '#0a0a15';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // 網格背景
  ctx.strokeStyle = 'rgba(0,255,136,0.05)';
  ctx.lineWidth = 1;
  for (let x = 0; x < canvas.width; x += 40) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
  }
  for (let y = 0; y < canvas.height; y += 40) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
  }

  // 時間膠囊效果：畫面淡淡的紫色濾鏡
  if (player.slowTimer > 0) {
    ctx.fillStyle = 'rgba(170,136,255,0.08)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  // 道具
  for (const item of items) {
    const it = ITEM_TYPES[item.type];
    ctx.save();
    ctx.translate(item.x, item.y);
    ctx.fillStyle = it.color;
    ctx.globalAlpha = 0.15 + Math.sin(game.time * 0.1) * 0.1;
    ctx.beginPath();
    ctx.arc(0, 0, item.radius + 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = it.color;
    ctx.beginPath();
    ctx.arc(0, 0, item.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = '16px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(it.icon, 0, 1);
    ctx.restore();
  }

  // 玩家護盾光環
  if (player.shield > 0) {
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.strokeStyle = `rgba(0,170,255,${0.4 + Math.sin(game.time * 0.15) * 0.2})`;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(0, 0, player.radius + 12, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = 'rgba(0,170,255,0.08)';
    ctx.beginPath();
    ctx.arc(0, 0, player.radius + 12, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // 反彈盾光環
  if (player.reflect > 0) {
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.strokeStyle = `rgba(0,255,255,${0.5 + Math.sin(game.time * 0.2) * 0.3})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, player.radius + 20, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  // 加速鞋效果：拖尾
  if (player.speedTimer > 0) {
    ctx.save();
    ctx.fillStyle = 'rgba(255,238,0,0.25)';
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.radius + 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // 玩家
  ctx.save();
  ctx.translate(player.x, player.y);
  if (player.invincible > 0 && Math.floor(player.invincible / 4) % 2 === 0) {
    ctx.globalAlpha = 0.4;
  }
  ctx.fillStyle = '#00ff88';
  ctx.shadowColor = '#00ff88';
  ctx.shadowBlur = 15;
  ctx.beginPath();
  ctx.arc(0, 0, player.radius, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(-5, -5, 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // 子彈
  for (const b of bullets) {
    ctx.fillStyle = b.color;
    ctx.shadowColor = b.color;
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // 粒子
  for (const p of particles) {
    ctx.globalAlpha = p.life / 50;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // 漂浮文字
  for (const ft of floatingTexts) {
    ctx.globalAlpha = Math.min(1, ft.life / 20);
    ctx.fillStyle = ft.color;
    ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(ft.text, ft.x, ft.y);
  }
  ctx.globalAlpha = 1;

  // UI - 血量條
  const barW = 200, barH = 18;
  const barX = canvas.width / 2 - barW / 2, barY = 12;
  ctx.fillStyle = 'rgba(255,0,68,0.2)';
  ctx.fillRect(barX, barY, barW, barH);
  ctx.fillStyle = player.hp > 30 ? '#00ff88' : '#ff0044';
